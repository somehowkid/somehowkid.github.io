  #intro p{color:var(--mid);font-size:clamp(11px,3.5vh,15px);letter-spacing:.08em}
  #go{border:1px solid rgba(255,255,255,.5);padding:min(14px,3vh) 38px;border-radius:40px;font-size:15px;letter-spacing:.2em;text-transform:uppercase;transition:background .3s,color .3s}
  #go:hover{background:var(--fg);color:#000}
  #intro.out{opacity:0;pointer-events:none}
</style>

track.addEventListener('click',e=>{const r=track.getBoundingClientRect();if(a.duration)a.currentTime=(e.clientX-r.left)/r.width*a.duration;render(find(a.currentTime))});
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(document.getElementById('intro').classList.contains('out'))toggle();else document.getElementById('go').click()}
  if(e.code==='ArrowRight')a.currentTime+=5;if(e.code==='ArrowLeft')a.currentTime-=5});
</script>
</body>
</html>
